<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>并发租约锁验收台</title>
    <link rel="stylesheet" href="src/styles.css">
    <style>
      .frame-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      iframe { width: 100%; height: 360px; border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 16px; background: #0b1020; }
      body.runner-frame header, body.runner-frame .bottom-grid, body.runner-frame .log-panel { display: none; }
      body.runner-frame .shell { width: 100%; padding: 12px; }
      body.runner-frame .grid { grid-template-columns: 1fr; margin: 0; }
      body.runner-frame .controls-panel { display: none; }
      .verdict { padding: 16px; border-radius: 16px; background: rgba(52, 211, 153, 0.12); color: #6ee7b7; font-weight: 900; }
      .verdict.fail { background: rgba(244, 63, 94, 0.14); color: #fda4af; }
      .timeline { display: grid; gap: 8px; max-height: 260px; overflow: auto; }
      .timeline div { padding: 10px; border-radius: 12px; background: rgba(2, 6, 23, 0.34); font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Acceptance Harness</p>
          <h1>并发租约锁验收台</h1>
          <p class="subtitle">4 个独立页面同时竞争；前 3 个不续约，最后 1 个验证自动续约。</p>
        </div>
        <button id="startBtn" type="button">开始 4 路并发</button>
      </header>

      <section class="panel">
        <div class="panel-heading compact">
          <div>
            <p class="eyebrow">Result</p>
            <h2 id="verdict">等待开始</h2>
          </div>
        </div>
        <div id="metrics" class="details">
          <div><dt>持有者数量</dt><dd>—</dd></div>
          <div><dt>唯一持有者数量</dt><dd>—</dd></div>
          <div><dt>FIFO</dt><dd>—</dd></div>
          <div><dt>自动续约</dt><dd>—</dd></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-heading compact">
          <div><p class="eyebrow">Timeline</p><h2>交接记录</h2></div>
        </div>
        <div id="timeline" class="timeline"></div>
      </section>

      <section class="frame-grid" id="frames"></section>
    </main>
    <script type="module" src="src/concurrency.js"></script>
  </body>
</html>
